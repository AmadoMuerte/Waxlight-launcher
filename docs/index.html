<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=ru/">
  <meta name="robots" content="noindex">
  <title>Waxlight Wiki</title>
  <script>
    const languages = navigator.languages ?? [navigator.language];
    const target = languages.some((language) => language?.toLowerCase().startsWith("en")) ? "en/" : "ru/";
    window.location.replace(target);
  </script>
</head>
<body>
  <p><a href="ru/">Русский</a> | <a href="en/">English</a></p>
</body>
</html>
