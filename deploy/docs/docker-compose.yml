services:
  docs:
    image: ghcr.io/amadomuerte/waxlight-docs:${DOCS_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
