server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed build assets are content-addressed and can be cached for a year.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # HTML pages must revalidate on every visit so a fresh deployment is
    # never mixed with cached pages from an older build. ETag and
    # Last-Modified are generated by nginx automatically.
    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}