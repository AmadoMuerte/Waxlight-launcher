name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-24.04

    outputs:
      release-tag: ${{ steps.release.outputs.release-tag }}
      should-release: ${{ steps.release.outputs.should-release }}

    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read release metadata
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(node -p "require('./wails.json').info.productVersion")"
          tag="v${version}"
          echo "release-tag=$tag" >> "$GITHUB_OUTPUT"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to publish."
            echo "should-release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Preparing release $tag."
            echo "should-release=true" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: Verify release source
    runs-on: ubuntu-24.04
    needs: prepare
    if: needs.prepare.outputs.should-release == 'true'

    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release-tag }}

    outputs:
      release-tag: ${{ needs.prepare.outputs.release-tag }}

    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Verify release notes file
        shell: bash
        run: |
          if [[ ! -s "releases/${RELEASE_TAG}.md" ]]; then
            echo "Release notes file is missing: releases/${RELEASE_TAG}.md" >&2
            echo "Commit the release notes as part of the release preparation." >&2
            exit 1
          fi
          echo "Release notes file found: releases/${RELEASE_TAG}.md"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --include=dev --prefix frontend

      - name: Confirm tag and application version
        shell: bash
        run: |
          ./scripts/check-version.sh "${RELEASE_TAG#v}"

      - name: Build frontend assets
        run: npm --prefix frontend run build

      - name: Test backend
        run: go test ./...

      - name: Race-test backend
        run: go test -race ./...

      - name: Vet backend
        run: go vet ./...

      - name: Test frontend
        run: npm --prefix frontend test

      - name: Check prohibited security patterns
        run: ./scripts/check-security-patterns.sh

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Run govulncheck
        run: govulncheck ./...

  linux:
    name: Package Linux
    runs-on: ubuntu-24.04
    needs:
      - verify

    env:
      RELEASE_TAG: ${{ needs.verify.outputs.release-tag }}

    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install \
            --no-install-recommends \
            -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            rpm

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      - name: Build Linux packages
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          ./scripts/build-linux.sh \
            "${RELEASE_TAG#v}" \
            release

      - name: Verify Linux packages
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"

          expected_assets=(
            "Waxlight-Launcher-v${version}-linux-amd64.tar.gz"
            "Waxlight-Launcher-v${version}-linux-amd64.deb"
            "Waxlight-Launcher-v${version}-linux-amd64.rpm"
          )

          for asset in "${expected_assets[@]}"; do
            if [[ ! -s "release/$asset" ]]; then
              echo "Missing or empty Linux release asset: $asset" >&2
              exit 1
            fi
          done

          ls -lh release

      - name: Upload Linux packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-packages
          path: release/*
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Package Windows
    runs-on: windows-latest
    needs:
      - verify

    env:
      RELEASE_TAG: ${{ needs.verify.outputs.release-tag }}

    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Windows build tools
        shell: powershell
        run: |
          choco install mingw nsis --no-progress -y
          npm install --global resedit-cli@3.1.0

          $CandidateDirectories = @(
            "C:\ProgramData\mingw64\mingw64\bin",
            "C:\ProgramData\mingw64\mingw32\bin",
            "$env:ChocolateyInstall\bin"
          )

          $MingwBin = $CandidateDirectories |
            Where-Object {
              Test-Path (Join-Path $_ "gcc.exe")
            } |
            Select-Object -First 1

          if (-not $MingwBin) {
            $Gcc = Get-ChildItem `
              -Path "C:\ProgramData" `
              -Filter "gcc.exe" `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if ($Gcc) {
              $MingwBin = $Gcc.Directory.FullName
            }
          }

          if (-not $MingwBin) {
            throw "Chocolatey installed MinGW, but gcc.exe was not found"
          }

          $NsisDirectory = "${env:ProgramFiles(x86)}\NSIS"
          $NpmGlobalPrefix = (npm prefix --global).Trim()

          if (-not (Test-Path (Join-Path $NsisDirectory "makensis.exe"))) {
            throw "Chocolatey did not install makensis.exe in $NsisDirectory"
          }

          $env:Path = "$MingwBin;$NsisDirectory;$NpmGlobalPrefix;$env:Path"

          $MingwBin |
            Out-File `
              -FilePath $env:GITHUB_PATH `
              -Encoding utf8 `
              -Append

          $NsisDirectory |
            Out-File `
              -FilePath $env:GITHUB_PATH `
              -Encoding utf8 `
              -Append

          $NpmGlobalPrefix |
            Out-File `
              -FilePath $env:GITHUB_PATH `
              -Encoding utf8 `
              -Append

          Write-Host "MinGW path: $MingwBin"
          Write-Host "NSIS path: $NsisDirectory"
          Write-Host "npm global path: $NpmGlobalPrefix"

          gcc --version
          g++ --version
          makensis /VERSION
          resedit --version

      - name: Install Wails CLI
        shell: powershell
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

          (go env GOPATH) + "\bin" |
            Out-File `
              -FilePath $env:GITHUB_PATH `
              -Encoding utf8 `
              -Append

      - name: Verify Windows build tools
        shell: powershell
        run: |
          gcc --version
          g++ --version
          makensis /VERSION
          resedit --version
          wails version

      - name: Build Windows packages
        shell: powershell
        env:
          CGO_ENABLED: "1"
          CC: gcc
          CXX: g++
        run: |
          Write-Host "CGO_ENABLED=$env:CGO_ENABLED"
          Write-Host "CC=$env:CC"
          Write-Host "CXX=$env:CXX"

          ./scripts/build-windows.ps1 `
            -Version $env:RELEASE_TAG `
            -OutputDirectory release

      - name: Validate Windows executable metadata
        shell: powershell
        run: |
          $Version = $env:RELEASE_TAG.TrimStart("v")
          $Executable = "release\Waxlight-Launcher-v$Version-windows-amd64.exe"
          $Installer = "release\Waxlight-Launcher-v$Version-windows-amd64-installer.exe"

          $Build = 0
          if ($Version -match "-") {
            $Prerelease = ($Version -split "-", 2)[1]
            $PrereleaseMatch = [regex]::Match($Prerelease, '^(alpha|beta|rc)\.([1-9][0-9]{0,3})$')
            if (-not $PrereleaseMatch.Success) {
              throw "Windows prereleases must use alpha.N, beta.N, or rc.N: $Version"
            }
            $Sequence = [int]$PrereleaseMatch.Groups[2].Value
            if ($Sequence -gt 19999) {
              throw "Windows prerelease sequence must not exceed 19999: $Version"
            }
            $Build = switch ($PrereleaseMatch.Groups[1].Value) {
              "alpha" { $Sequence }
              "beta" { 20000 + $Sequence }
              "rc" { 40000 + $Sequence }
            }
          }
          $BaseVersion = ($Version -split "-", 2)[0]
          $ExpectedVersion = "$BaseVersion.$Build"
          $CopyrightSymbol = [char]0x00A9
          $ExpectedCopyright = "Copyright $CopyrightSymbol 2026 AmadoMuerte"

          foreach ($Artifact in @(
            @{ Path = $Executable; FileDescription = "Waxlight Launcher" },
            @{ Path = $Installer; FileDescription = "Waxlight Launcher Installer" }
          )) {
            if (-not (Test-Path $Artifact.Path)) {
              throw "Windows artifact not found: $($Artifact.Path)"
            }
            $VersionInfo = (Get-Item $Artifact.Path).VersionInfo
            $Errors = @()
            foreach ($Property in @(
              @{ Name = "FileDescription"; Expected = $Artifact.FileDescription },
              @{ Name = "ProductName"; Expected = "Waxlight Launcher" },
              @{ Name = "CompanyName"; Expected = "AmadoMuerte" },
              @{ Name = "LegalCopyright"; Expected = $ExpectedCopyright },
              @{ Name = "FileVersion"; Expected = $ExpectedVersion },
              @{ Name = "ProductVersion"; Expected = $ExpectedVersion }
            )) {
              if ($VersionInfo.($Property.Name) -ne $Property.Expected) {
                $Errors += "$($Property.Name) must be '$($Property.Expected)', got '$($VersionInfo.($Property.Name))'"
              }
            }
            if ($Errors.Count -gt 0) {
              throw "Windows metadata validation failed for $($Artifact.Path): $($Errors -join '; ')"
            }
          }

          Write-Host "Windows metadata validation passed" -ForegroundColor Green

      # Windows release artifacts are currently published unsigned.

      - name: Verify Windows packages
        shell: powershell
        run: |
          $Version = $env:RELEASE_TAG.TrimStart("v")

          $ExpectedAssets = @(
            "Waxlight-Launcher-v$Version-windows-amd64.exe",
            "Waxlight-Launcher-v$Version-windows-amd64-portable.zip",
            "Waxlight-Launcher-v$Version-windows-amd64-installer.exe"
          )

          foreach ($Asset in $ExpectedAssets) {
            $Path = Join-Path "release" $Asset

            if (-not (Test-Path $Path)) {
              throw "Missing Windows release asset: $Asset"
            }

            if ((Get-Item $Path).Length -le 0) {
              throw "Empty Windows release asset: $Asset"
            }
          }

          Get-ChildItem release |
            Format-Table Name, Length

      - name: Upload Windows packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-packages
          path: release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-24.04

    needs:
      - verify
      - linux
      - windows

    env:
      RELEASE_TAG: ${{ needs.verify.outputs.release-tag }}

    permissions:
      contents: write

    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Download release packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: "*-packages"
          path: release
          merge-multiple: true

      - name: Verify all release assets
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"

          expected_assets=(
            "Waxlight-Launcher-v${version}-linux-amd64.tar.gz"
            "Waxlight-Launcher-v${version}-linux-amd64.deb"
            "Waxlight-Launcher-v${version}-linux-amd64.rpm"
            "Waxlight-Launcher-v${version}-windows-amd64.exe"
            "Waxlight-Launcher-v${version}-windows-amd64-portable.zip"
            "Waxlight-Launcher-v${version}-windows-amd64-installer.exe"
          )

          for asset in "${expected_assets[@]}"; do
            if [[ ! -s "release/$asset" ]]; then
              echo "Missing or empty release asset: $asset" >&2
              exit 1
            fi
          done

          (
            cd release
            sha256sum "${expected_assets[@]}" > SHA256SUMS
          )

          echo "Release assets:"
          ls -lh release

          echo
          echo "Checksums:"
          cat release/SHA256SUMS

      - name: Generate update manifest
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          channel="stable"
          if [[ "$RELEASE_TAG" == *-* ]]; then
            channel="prerelease"
          fi

          publish_time=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          cat > release/update-manifest.json << EOF
          {
            "schemaVersion": 1,
            "version": "$version",
            "channel": "$channel",
            "publishedAt": "$publish_time",
            "assets": {
              "windows-amd64-installer": {
                "name": "Waxlight-Launcher-v${version}-windows-amd64-installer.exe",
                "size": $(stat -c%s "release/Waxlight-Launcher-v${version}-windows-amd64-installer.exe" 2>/dev/null || stat -f%z "release/Waxlight-Launcher-v${version}-windows-amd64-installer.exe" 2>/dev/null || echo 0),
                "sha256": "$(grep "Waxlight-Launcher-v${version}-windows-amd64-installer.exe" release/SHA256SUMS | cut -d' ' -f1)"
              },
              "windows-amd64-portable": {
                "name": "Waxlight-Launcher-v${version}-windows-amd64-portable.zip",
                "size": $(stat -c%s "release/Waxlight-Launcher-v${version}-windows-amd64-portable.zip" 2>/dev/null || stat -f%z "release/Waxlight-Launcher-v${version}-windows-amd64-portable.zip" 2>/dev/null || echo 0),
                "sha256": "$(grep "Waxlight-Launcher-v${version}-windows-amd64-portable.zip" release/SHA256SUMS | cut -d' ' -f1)"
              },
              "windows-amd64-standalone": {
                "name": "Waxlight-Launcher-v${version}-windows-amd64.exe",
                "size": $(stat -c%s "release/Waxlight-Launcher-v${version}-windows-amd64.exe" 2>/dev/null || stat -f%z "release/Waxlight-Launcher-v${version}-windows-amd64.exe" 2>/dev/null || echo 0),
                "sha256": "$(grep "Waxlight-Launcher-v${version}-windows-amd64.exe" release/SHA256SUMS | cut -d' ' -f1)"
              },
              "linux-amd64-tar": {
                "name": "Waxlight-Launcher-v${version}-linux-amd64.tar.gz",
                "size": $(stat -c%s "release/Waxlight-Launcher-v${version}-linux-amd64.tar.gz" 2>/dev/null || stat -f%z "release/Waxlight-Launcher-v${version}-linux-amd64.tar.gz" 2>/dev/null || echo 0),
                "sha256": "$(grep "Waxlight-Launcher-v${version}-linux-amd64.tar.gz" release/SHA256SUMS | cut -d' ' -f1)"
              },
              "linux-amd64-deb": {
                "name": "Waxlight-Launcher-v${version}-linux-amd64.deb",
                "size": $(stat -c%s "release/Waxlight-Launcher-v${version}-linux-amd64.deb" 2>/dev/null || stat -f%z "release/Waxlight-Launcher-v${version}-linux-amd64.deb" 2>/dev/null || echo 0),
                "sha256": "$(grep "Waxlight-Launcher-v${version}-linux-amd64.deb" release/SHA256SUMS | cut -d' ' -f1)"
              },
              "linux-amd64-rpm": {
                "name": "Waxlight-Launcher-v${version}-linux-amd64.rpm",
                "size": $(stat -c%s "release/Waxlight-Launcher-v${version}-linux-amd64.rpm" 2>/dev/null || stat -f%z "release/Waxlight-Launcher-v${version}-linux-amd64.rpm" 2>/dev/null || echo 0),
                "sha256": "$(grep "Waxlight-Launcher-v${version}-linux-amd64.rpm" release/SHA256SUMS | cut -d' ' -f1)"
              }
            }
          }
          EOF

          echo "Generated update manifest:"
          cat release/update-manifest.json

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          source_notes_file="releases/${RELEASE_TAG}.md"
          notes_file="$RUNNER_TEMP/${RELEASE_TAG}-release-notes.md"

          if [[ ! -s "$source_notes_file" ]]; then
            echo "Release notes file is missing: $source_notes_file" >&2
            echo "Commit the release notes as part of the release preparation." >&2
            exit 1
          fi

          cp "$source_notes_file" "$notes_file"
          printf '\n## Code signing policy\n\n%s\n' \
            "Windows artifacts are currently unsigned. See the [Waxlight Code signing policy](https://github.com/AmadoMuerte/Waxlight-launcher/blob/main/docs/CODE_SIGNING_POLICY.md) for release verification information." \
            >> "$notes_file"

          prerelease_args=()

          if [[ "$RELEASE_TAG" == *-* ]]; then
            echo "Detected pre-release version: $RELEASE_TAG"
            prerelease_args+=(--prerelease)
          else
            echo "Detected stable version: $RELEASE_TAG"
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to replace assets for existing release $RELEASE_TAG" >&2
            exit 1
          fi

          if git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            if [[ "$(git rev-list -n 1 "$RELEASE_TAG")" != "$GITHUB_SHA" ]]; then
              echo "Tag $RELEASE_TAG does not point to $GITHUB_SHA" >&2
              exit 1
            fi
          else
            git tag -a "$RELEASE_TAG" -m "Waxlight Launcher $RELEASE_TAG" "$GITHUB_SHA"
            git push origin "$RELEASE_TAG"
          fi

          gh release create \
            "$RELEASE_TAG" \
            release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Waxlight Launcher ${RELEASE_TAG#v}" \
            --notes-file "$notes_file" \
            --verify-tag \
            "${prerelease_args[@]}"

      - name: Send Discord release notification
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
        shell: bash
        run: |
          prerelease="false"
          if [[ "$RELEASE_TAG" == *-* ]]; then
            prerelease="true"
          fi
          ./scripts/send-discord-release.sh "$RELEASE_TAG" "$prerelease"
