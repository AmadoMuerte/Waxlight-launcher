name: Release

on:
  push:
    tags:
      - "v*.*.*"

  workflow_dispatch:
    inputs:
      version:
        description: Existing release tag to build, for example v0.1.3
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-24.04

    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # Go 1.25 is used here because govulncheck v1.6.0 requires it.
          # The project itself may still declare Go 1.24 in go.mod.
          go-version: "1.25.x"
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --include=dev --prefix frontend

      - name: Confirm tag and application version
        shell: bash
        run: |
          git describe --tags --exact-match
          ./scripts/check-version.sh "${RELEASE_TAG#v}"

      - name: Build frontend assets
        run: npm --prefix frontend run build

      - name: Test backend
        run: go test ./...

      - name: Race-test backend
        run: go test -race ./...

      - name: Vet backend
        run: go vet ./...

      - name: Test frontend
        run: npm --prefix frontend test

      - name: Check prohibited security patterns
        run: ./scripts/check-security-patterns.sh

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Run govulncheck
        run: govulncheck ./...

  linux:
    name: Package Linux
    runs-on: ubuntu-24.04
    needs:
      - verify

    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install \
            --no-install-recommends \
            -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            rpm

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      - name: Build Linux packages
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          ./scripts/build-linux.sh \
            "${RELEASE_TAG#v}" \
            release

      - name: Verify Linux packages
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"

          expected_assets=(
            "Waxlight-Launcher-v${version}-linux-amd64.tar.gz"
            "Waxlight-Launcher-v${version}-linux-amd64.deb"
            "Waxlight-Launcher-v${version}-linux-amd64.rpm"
          )

          for asset in "${expected_assets[@]}"; do
            if [[ ! -s "release/$asset" ]]; then
              echo "Missing or empty Linux release asset: $asset" >&2
              exit 1
            fi
          done

          ls -lh release

      - name: Upload Linux packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-packages
          path: release/*
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Package Windows
    runs-on: windows-latest
    needs:
      - verify

    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install MinGW and NSIS
        shell: powershell
        run: |
          choco install mingw nsis --no-progress -y

          $CandidateDirectories = @(
            "C:\ProgramData\mingw64\mingw64\bin",
            "C:\ProgramData\mingw64\mingw32\bin",
            "$env:ChocolateyInstall\bin"
          )

          $MingwBin = $CandidateDirectories |
            Where-Object {
              Test-Path (Join-Path $_ "gcc.exe")
            } |
            Select-Object -First 1

          if (-not $MingwBin) {
            $Gcc = Get-ChildItem `
              -Path "C:\ProgramData" `
              -Filter "gcc.exe" `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if ($Gcc) {
              $MingwBin = $Gcc.Directory.FullName
            }
          }

          if (-not $MingwBin) {
            throw "Chocolatey installed MinGW, but gcc.exe was not found"
          }

          $NsisDirectory = "${env:ProgramFiles(x86)}\NSIS"

          if (-not (Test-Path (Join-Path $NsisDirectory "makensis.exe"))) {
            throw "Chocolatey did not install makensis.exe in $NsisDirectory"
          }

          $env:Path = "$MingwBin;$NsisDirectory;$env:Path"

          $MingwBin |
            Out-File `
              -FilePath $env:GITHUB_PATH `
              -Encoding utf8 `
              -Append

          $NsisDirectory |
            Out-File `
              -FilePath $env:GITHUB_PATH `
              -Encoding utf8 `
              -Append

          Write-Host "MinGW path: $MingwBin"
          Write-Host "NSIS path: $NsisDirectory"

          gcc --version
          g++ --version
          makensis /VERSION

      - name: Install Wails CLI
        shell: powershell
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

          (go env GOPATH) + "\bin" |
            Out-File `
              -FilePath $env:GITHUB_PATH `
              -Encoding utf8 `
              -Append

      - name: Verify Windows build tools
        shell: powershell
        run: |
          gcc --version
          g++ --version
          makensis /VERSION
          wails version

      - name: Build Windows packages
        shell: powershell
        env:
          CGO_ENABLED: "1"
          CC: gcc
          CXX: g++
        run: |
          Write-Host "CGO_ENABLED=$env:CGO_ENABLED"
          Write-Host "CC=$env:CC"
          Write-Host "CXX=$env:CXX"

          ./scripts/build-windows.ps1 `
            -Version $env:RELEASE_TAG `
            -OutputDirectory release

      - name: Verify Windows packages
        shell: powershell
        run: |
          $Version = $env:RELEASE_TAG.TrimStart("v")

          $ExpectedAssets = @(
            "Waxlight-Launcher-v$Version-windows-amd64.exe",
            "Waxlight-Launcher-v$Version-windows-amd64-portable.zip",
            "Waxlight-Launcher-v$Version-windows-amd64-installer.exe"
          )

          foreach ($Asset in $ExpectedAssets) {
            $Path = Join-Path "release" $Asset

            if (-not (Test-Path $Path)) {
              throw "Missing Windows release asset: $Asset"
            }

            if ((Get-Item $Path).Length -le 0) {
              throw "Empty Windows release asset: $Asset"
            }
          }

          Get-ChildItem release |
            Format-Table Name, Length

      - name: Upload Windows packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-packages
          path: release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-24.04

    needs:
      - linux
      - windows

    permissions:
      contents: write

    steps:
      - name: Download release packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: "*-packages"
          path: release
          merge-multiple: true

      - name: Verify all release assets
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"

          expected_assets=(
            "Waxlight-Launcher-v${version}-linux-amd64.tar.gz"
            "Waxlight-Launcher-v${version}-linux-amd64.deb"
            "Waxlight-Launcher-v${version}-linux-amd64.rpm"
            "Waxlight-Launcher-v${version}-windows-amd64.exe"
            "Waxlight-Launcher-v${version}-windows-amd64-portable.zip"
            "Waxlight-Launcher-v${version}-windows-amd64-installer.exe"
          )

          for asset in "${expected_assets[@]}"; do
            if [[ ! -s "release/$asset" ]]; then
              echo "Missing or empty release asset: $asset" >&2
              exit 1
            fi
          done

          (
            cd release
            sha256sum "${expected_assets[@]}" > SHA256SUMS
          )

          echo "Release assets:"
          ls -lh release

          echo
          echo "Checksums:"
          cat release/SHA256SUMS

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          prerelease_args=()

          if [[ "$RELEASE_TAG" == *-* ]]; then
            echo "Detected pre-release version: $RELEASE_TAG"
            prerelease_args+=(--prerelease)
          else
            echo "Detected stable version: $RELEASE_TAG"
          fi

          if gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then

            echo "Release $RELEASE_TAG already exists."
            echo "Replacing release assets..."

            gh release upload \
              "$RELEASE_TAG" \
              release/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber

            gh release edit \
              "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Waxlight Launcher ${RELEASE_TAG#v}" \
              "${prerelease_args[@]}"
          else
            gh release create \
              "$RELEASE_TAG" \
              release/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Waxlight Launcher ${RELEASE_TAG#v}" \
              --generate-notes \
              --verify-tag \
              "${prerelease_args[@]}"
          fi
