name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Existing release tag to build
        required: true
        default: v0.1.2
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-24.04
    steps:
      - name: Validate tag format
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Confirm tag and application version
        shell: bash
        run: |
          git describe --tags --exact-match
          ./scripts/check-version.sh "${RELEASE_TAG#v}"

  linux:
    name: Package Linux
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgtk-3-dev libwebkit2gtk-4.1-dev rpm

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      - name: Build Linux packages
        shell: bash
        run: ./scripts/build-linux.sh "${RELEASE_TAG#v}" release

      - name: Upload Linux packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-packages
          path: release/*
          if-no-files-found: error

  windows:
    name: Package Windows
    needs: verify
    runs-on: windows-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install NSIS
        shell: powershell
        run: |
          choco install nsis --no-progress -y
          $NsisDirectory = "${env:ProgramFiles(x86)}\NSIS"
          if (-not (Test-Path (Join-Path $NsisDirectory "makensis.exe"))) {
            throw "Chocolatey did not install makensis.exe in $NsisDirectory"
          }
          $NsisDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Wails CLI
        shell: powershell
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0
          (go env GOPATH) + "\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Windows packages
        shell: powershell
        run: ./scripts/build-windows.ps1 -Version $env:RELEASE_TAG -OutputDirectory release

      - name: Upload Windows packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-packages
          path: release/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: "*-packages"
          path: release
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          expected_assets=(
            "Waxlight-Launcher-v${version}-linux-amd64.tar.gz"
            "Waxlight-Launcher-v${version}-linux-amd64.deb"
            "Waxlight-Launcher-v${version}-linux-amd64.rpm"
            "Waxlight-Launcher-v${version}-windows-amd64.exe"
            "Waxlight-Launcher-v${version}-windows-amd64-portable.zip"
            "Waxlight-Launcher-v${version}-windows-amd64-installer.exe"
          )
          for asset in "${expected_assets[@]}"; do
            test -s "release/$asset" || { echo "Missing release asset: $asset" >&2; exit 1; }
          done
          cd release
          sha256sum "${expected_assets[@]}" > SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Waxlight Launcher ${RELEASE_TAG#v}" \
            --generate-notes \
            --verify-tag
