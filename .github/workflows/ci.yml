name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests and static checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --include=dev --prefix frontend

      - name: Build frontend assets
        run: npm --prefix frontend run build

      - name: Test backend
        run: go test ./...

      - name: Race-test backend
        run: go test -race ./...

      - name: Vet backend
        run: go vet ./...

      - name: Test frontend
        run: npm --prefix frontend test

      - name: Validate release metadata
        run: |
          version="$(node -p "require('./wails.json').info.productVersion")"
          ./scripts/check-version.sh "$version"

      - name: Check prohibited security patterns
        run: ./scripts/check-security-patterns.sh

  security:
    name: Vulnerability and secret scanning
    runs-on: ubuntu-24.04
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...
      - name: Scan Git history for secrets
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          gitleaks git --redact --no-banner

  native-credential-store:
    name: Native credential store (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Install Linux Secret Service implementation
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y dbus-x11 gnome-keyring
      - name: Test Linux Secret Service adapter
        if: runner.os == 'Linux'
        run: dbus-run-session -- bash -c 'eval "$(printf "\n" | gnome-keyring-daemon --unlock --components=secrets)" && go test -tags=integration ./internal/infrastructure/credentials -run TestNativeCredentialStoreRoundTrip'
      - name: Test Windows Credential Manager adapter
        if: runner.os == 'Windows'
        run: go test -tags=integration ./internal/infrastructure/credentials -run TestNativeCredentialStoreRoundTrip

  linux-build:
    name: Linux desktop build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Prepare frontend assets
        run: |
          npm ci --include=dev --prefix frontend
          npm --prefix frontend run build

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      - name: Build Linux application
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/waxlight-config
        run: |
          mkdir -p "$XDG_CONFIG_HOME"
          cd cmd/waxlight
          wails build -clean -platform linux/amd64
