name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests and static checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --include=dev --prefix frontend

      - name: Build frontend assets
        run: npm --prefix frontend run build

      - name: Test backend
        run: go test ./...

      - name: Vet backend
        run: go vet ./...

      - name: Test frontend
        run: npm --prefix frontend test

      - name: Validate release metadata
        run: ./scripts/check-version.sh 0.1.1

  linux-build:
    name: Linux desktop build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Prepare frontend assets
        run: |
          npm ci --include=dev --prefix frontend
          npm --prefix frontend run build

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      - name: Build Linux application
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/waxlight-config
        run: |
          mkdir -p "$XDG_CONFIG_HOME"
          cd cmd/waxlight
          wails build -clean -platform linux/amd64
