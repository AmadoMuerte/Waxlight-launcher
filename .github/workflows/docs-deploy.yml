name: Documentation deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: waxlight-docs-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and deploy documentation
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/site/package-lock.json

      - name: Install documentation dependencies
        run: npm ci --include=dev --prefix docs/site

      - name: Generate and build documentation
        shell: bash
        run: |
          # Prove the output tree is fully regenerated: stale pages from an
          # older generation must not survive a fresh build.
          rm -rf docs/generated/wails-api docs/site/api
          make api-docs-build
          git diff --exit-code -- docs/wails-api-inventory.json
          test -f docs/site/.vitepress/dist/index.html
          # Guard against obsolete API names leaking back into the docs.
          ! grep -R "InstallGameVersion" docs/site/.vitepress/dist
          # Generated type pages referenced by controller pages must exist.
          test -f docs/site/api/types/Preview.md
          test -f docs/site/api/types/Result.md
          # Clean regeneration must be reproducible: the generated Markdown
          # tree has to be byte-identical across repeated generations.
          make api-docs
          before="$(find docs/generated/wails-api -type f | sort | xargs md5sum | md5sum)"
          make api-docs
          after="$(find docs/generated/wails-api -type f | sort | xargs md5sum | md5sum)"
          test "$before" = "$after"

      - name: Log in to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build and publish image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: deploy/docs/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/amadomuerte/waxlight-docs:latest
            ghcr.io/amadomuerte/waxlight-docs:sha-${{ github.sha }}

      - name: Deploy immutable image
        shell: bash
        env:
          DOCS_HOST: ${{ secrets.DOCS_HOST }}
          DOCS_USER: ${{ secrets.DOCS_USER }}
          DOCS_SSH_KEY: ${{ secrets.DOCS_SSH_KEY }}
          DOCS_IMAGE_TAG: sha-${{ github.sha }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DOCS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DOCS_HOST" > ~/.ssh/known_hosts 2>/dev/null
          ssh "$DOCS_USER@$DOCS_HOST" "DOCS_IMAGE_TAG='$DOCS_IMAGE_TAG' bash -s" <<'REMOTE'
          set -euo pipefail
          cd ~/projects/Waxlight-launcher
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          DOCS_IMAGE_TAG="$DOCS_IMAGE_TAG" docker compose -f deploy/docs/docker-compose.yml pull
          DOCS_IMAGE_TAG="$DOCS_IMAGE_TAG" docker compose -f deploy/docs/docker-compose.yml up -d --remove-orphans
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:8088/health; then
              exit 0
            fi
            sleep 3
          done
          docker compose -f deploy/docs/docker-compose.yml ps
          docker compose -f deploy/docs/docker-compose.yml logs --tail=100
          exit 1
          REMOTE
