name: Documentation deployment

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "wailsdoc.yaml"
      - "internal/transport/wails/**"
      - ".github/workflows/docs-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and deploy documentation
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # TODO: pin the exact `1.4.4` release once Bun ships it as stable.
          # `bun-version: 1.4.4` is required today because the built-in linter
          # (`bun lint`, used by the frontend build) only exists in Bun >= 1.4.4.
          bun-version: 1.4.4

      - name: Verify Bun
        shell: bash
        run: bun --version

      - name: Install documentation dependencies
        run: bun install --cwd docs/site --frozen-lockfile

      - name: Generate and build documentation
        shell: bash
        run: |
          # Prove the output tree is fully regenerated: stale pages from an
          # older generation must not survive a fresh build.
          rm -rf docs/generated/wails-api docs/site/api
          make api-docs-build
          git diff --exit-code -- docs/wails-api-inventory.json
          test -f docs/site/.vitepress/dist/index.html
          # Guard against obsolete API names leaking back into the docs.
          ! grep -R "InstallGameVersion" docs/site/.vitepress/dist
          # Clean regeneration must be reproducible: the generated Markdown
          # tree has to be byte-identical across repeated generations.
          make api-docs
          before="$(find docs/generated/wails-api -type f | sort | xargs md5sum | md5sum)"
          make api-docs
          after="$(find docs/generated/wails-api -type f | sort | xargs md5sum | md5sum)"
          test "$before" = "$after"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/site/.vitepress/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
